[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-payments-data-quality"
version = "0.1.0"
description = "Production-oriented data quality controls for fintech payments using Soda Core, DuckDB, and Parquet."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Gregorio Hakimian" }]
keywords = ["data-quality", "soda", "duckdb", "parquet", "fintech", "payments"]
dependencies = [
  "duckdb>=1.4,<2",
  "soda-duckdb>=4.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
fintech-dq = "fintech_payments_dq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fintech_payments_dq"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".bootstrap-venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
